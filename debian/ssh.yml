name: "ssh configuration"
working-dir: /tmp/ssh
checks:
  requires-root: true
jobs:
  ssh-config:
    steps:
      - name: pre-check
        script: |
          const sudoUser = env.get("SUDO_USER")
          const envUser = env.get("USER")
          const user = sudoUser || envUser || "root"
          console.log(`SUDO_USER=${sudoUser || ''}, USER=${envUser || ''}`)
          console.log(`resolved user: ${user}, is root: ${user.toLowerCase() == "root"}`)
      - name: apply ssh configuration
        script: |
          const user = env.get("SUDO_USER") || env.get("USER") || "root"
          const isRoot = user.toLowerCase() == "root"
          let cfgFile = args.get('sshd_config')
          if (!cfgFile) {
            cfgFile = '/etc/ssh/sshd_config'
          }
          console.log('using config file: ' + cfgFile)

          // password login is always disabled; root keeps key-based login only
          let keys = {
            'PermitRootLogin': isRoot ? 'prohibit-password' : 'no',
            'PubkeyAuthentication': 'yes',
            'PasswordAuthentication': 'no',
            'PermitEmptyPasswords': 'no',
          }
          console.log(`mode: ${isRoot ? 'root' : 'non-root'} user (${user})`)
          Object.keys(keys).forEach(key => console.log(`  want: ${key} ${keys[key]}`))

          const lines = file.readFileAsLines(cfgFile)
          let missing = new Set(Object.keys(keys))
          let changed = false
          const newLines = lines.map(line => {
            line = line.trim()
            if (line.startsWith('#')) {
              return line
            }

            const key = line.split(/\s+/)[0]
            if (!(key in keys)) {
              return line
            }

            const newLine = `${key} ${keys[key]}`
            missing.delete(key)
            if (line == newLine) {
              console.log(`unchanged: ${line}`)
            } else {
              console.log(`updated: ${line} -> ${newLine}`)
              changed = true
            }
            return newLine
          })

          missing.forEach(key => {
            console.log(`appended: ${key} ${keys[key]}`)
            newLines.push(`${key} ${keys[key]}`)
            changed = true
          })

          if (!changed) {
            console.log('ssh configuration already up to date, no restart needed')
          } else {
            if (newLines.at(-1).trim() != '') {
              newLines.push('')
            }
            file.writeFile(cfgFile, newLines.join("\n"))
            console.log(`wrote ${cfgFile}`)
            console.log('ssh configuration changed, please verify and restart sshd to apply:')
            console.log('  sudo sshd -t && sudo systemctl restart ssh')
            console.log('keep the current session open and test a new ssh login before closing it')
          }
